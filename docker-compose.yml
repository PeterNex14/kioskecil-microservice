services:
  db_users:
    image: postgres:15-alpine
    container_name: db_users_container
    ports:
      - "${USER_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-db_users}
      POSTGRES_USER: ${USER_DB_USER:-user_dev_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-your_user_password_here}
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user_dev_user} -d ${USER_DB_NAME:-db_users}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user_service_container
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      - SERVICE_NAME=user-service
      - DB_HOST=db_users
      - DB_PORT=5432
    depends_on:
      db_users:
        condition: service_healthy

volumes:
  users_postgres_data:
